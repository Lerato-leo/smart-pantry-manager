<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit ingredient</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:#2B1B24;background:#FFF8EE}
a{color:#4A1942;text-decoration:none}a:hover{color:#2B1B24}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 360px; height: 800px; position: relative; overflow: hidden; background: #FFF8EE; display: flex; flex-direction: column">

  <header style="height: 64px; flex-shrink: 0; background: #4A1942; color: #FFFFFF; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="Pantry.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Edit ingredient</h1>
  </header>

  <form style="flex-grow: 1; padding: 28px 16px 16px; display: flex; flex-direction: column; gap: 24px">

    <div style="position: relative">
      <label for="ed-name" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #6B5A63">Ingredient name</label>
      <input id="ed-name" type="text" value="Cream" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 16px; border: 1px solid #9C8A92; border-radius: 12px; background: transparent; font-size: 16px; color: #2B1B24">
    </div>

    <div style="display: flex; gap: 12px">
      <div style="flex: 1 1 0; position: relative">
        <label for="ed-qty" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #4A1942; font-weight: 500">Quantity</label>
        <input id="ed-qty" type="text" inputmode="decimal" value="250" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #4A1942; border-radius: 12px; background: transparent; font-size: 16px; color: #2B1B24">
      </div>
      <div style="flex: 1 1 0; position: relative">
        <span id="ed-unit-label" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #6B5A63">Unit</span>
        <button type="button" aria-haspopup="listbox" aria-labelledby="ed-unit-label ed-unit-value" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 12px 0 16px; border: 1px solid #9C8A92; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #2B1B24">
          <span id="ed-unit-value">ml</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
    </div>

    <div style="position: relative">
      <span id="ed-cat-label" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #6B5A63">Category</span>
      <button type="button" aria-haspopup="listbox" aria-labelledby="ed-cat-label ed-cat-value" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 12px 0 16px; border: 1px solid #9C8A92; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #2B1B24">
        <span style="display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #2563EB"></span><span id="ed-cat-value">Dairy</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="position: relative">
        <label for="ed-expiry" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #6B5A63">Expiry date (optional)</label>
        <input id="ed-expiry" type="text" value="29/09/2026" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 56px 0 16px; border: 1px solid #9C8A92; border-radius: 12px; background: transparent; font-size: 16px; color: #2B1B24">
        <button type="button" aria-label="Pick expiry date" style="position: absolute; right: 4px; top: 4px; width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #4A1942; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
        </button>
      </div>
      <span style="align-self: flex-start; margin-left: 4px; display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #E0A100; color: #2B1B24; font-size: 12px; line-height: 16px; font-weight: 600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Expires in 2 days
      </span>
    </div>
  </form>

  <div style="flex-shrink: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #EFE3D3">
    <div style="display: flex; gap: 12px">
      <a href="Pantry.dc.html" style="flex: 1 1 0; height: 48px; box-sizing: border-box; border: 1px solid #9C8A92; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #4A1942">Cancel</a>
      <a href="Pantry.dc.html" style="flex: 1 1 0; height: 48px; border-radius: 24px; background: #4A1942; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #FFFFFF">Save</a>
    </div>
    <a href="Pantry.dc.html" style="height: 48px; box-sizing: border-box; border: 1px solid #C2410C; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; color: #C2410C">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg>
      Delete ingredient
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
