<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add ingredient</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins,"Segoe UI",system-ui,sans-serif;color:#2B1B24;background:#FFF8EE}
a{color:#4A1942;text-decoration:none}a:hover{color:#2B1B24}
button,input{font-family:inherit}
input::placeholder{color:#8A7A82}
</style>
</helmet>
<div style="width: 360px; height: 800px; position: relative; overflow: hidden; background: #FFF8EE; display: flex; flex-direction: column">

  <header style="height: 64px; flex-shrink: 0; background: #4A1942; color: #FFFFFF; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
    <a href="Pantry.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Add ingredient</h1>
  </header>

  <form style="flex-grow: 1; padding: 28px 16px 16px; display: flex; flex-direction: column; gap: 24px">

    <div style="position: relative">
      <label for="add-name" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #6B5A63">Ingredient name</label>
      <input id="add-name" type="text" value="Butternut" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 16px; border: 1px solid #9C8A92; border-radius: 12px; background: transparent; font-size: 16px; color: #2B1B24">
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start">
      <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 6px">
        <div style="position: relative">
          <label for="add-qty" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #C2410C; font-weight: 500">Quantity</label>
          <input id="add-qty" type="text" inputmode="decimal" placeholder="e.g. 800" aria-invalid="true" aria-describedby="add-qty-error" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #C2410C; border-radius: 12px; background: transparent; font-size: 16px; color: #2B1B24">
        </div>
        <div id="add-qty-error" style="display: flex; gap: 6px; align-items: flex-start; padding: 0 4px; font-size: 12px; line-height: 16px; color: #C2410C">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
          <span>Enter a quantity above 0</span>
        </div>
      </div>
      <div style="flex: 1 1 0; position: relative">
        <span id="add-unit-label" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #6B5A63">Unit</span>
        <button type="button" aria-haspopup="listbox" aria-labelledby="add-unit-label add-unit-value" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 12px 0 16px; border: 1px solid #9C8A92; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #2B1B24">
          <span id="add-unit-value">g</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
    </div>

    <div style="position: relative">
      <span id="add-cat-label" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #6B5A63">Category</span>
      <button type="button" aria-haspopup="listbox" aria-labelledby="add-cat-label add-cat-value" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 12px 0 16px; border: 1px solid #9C8A92; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #2B1B24">
        <span style="display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #4D7C0F"></span><span id="add-cat-value">Vegetables</span></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <div style="position: relative">
      <label for="add-expiry" style="position: absolute; left: 12px; top: -9px; padding: 0 4px; background: #FFF8EE; font-size: 12px; line-height: 18px; color: #6B5A63">Expiry date (optional)</label>
      <input id="add-expiry" type="text" placeholder="DD/MM/YYYY" style="width: 100%; height: 56px; box-sizing: border-box; padding: 0 56px 0 16px; border: 1px solid #9C8A92; border-radius: 12px; background: transparent; font-size: 16px; color: #2B1B24">
      <button type="button" aria-label="Pick expiry date" style="position: absolute; right: 4px; top: 4px; width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #4A1942; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
      </button>
    </div>
  </form>

  <div style="flex-shrink: 0; padding: 16px; display: flex; gap: 12px; border-top: 1px solid #EFE3D3">
    <a href="Pantry.dc.html" style="flex: 1 1 0; height: 48px; box-sizing: border-box; border: 1px solid #9C8A92; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #4A1942">Cancel</a>
    <a href="Pantry.dc.html" style="flex: 1 1 0; height: 48px; border-radius: 24px; background: #4A1942; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: #FFFFFF">Save</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
